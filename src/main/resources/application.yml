server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ddd;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
